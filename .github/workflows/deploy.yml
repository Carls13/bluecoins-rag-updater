name: Deploy Bluecoins API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      CREDENTIALS_SECRET_ARN: ${{ vars.CREDENTIALS_SECRET_ARN }}
      GOOGLE_DRIVE_FILE_ID: ${{ vars.GOOGLE_DRIVE_FILE_ID }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate deployment variables
        shell: bash
        run: |
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN STACK_NAME CREDENTIALS_SECRET_ARN GOOGLE_DRIVE_FILE_ID PINECONE_INDEX_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions variable $name is required."
              exit 1
            fi
          done

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsSAMDeploy

      - name: Build Lambda ZIP packages
        run: sam build --parallel

      - name: Deploy SAM stack
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "CredentialsSecretArn=$CREDENTIALS_SECRET_ARN" \
              "GoogleDriveFileId=$GOOGLE_DRIVE_FILE_ID" \
              "PineconeIndexName=$PINECONE_INDEX_NAME"

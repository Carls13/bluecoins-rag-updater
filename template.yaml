AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Bluecoins Google Drive to CSV and Pinecone indexing API

Parameters:
  GoogleCredentialsParameterName:
    Type: String
    Default: /bluecoins-rag-updater/google-service-account
    Description: Standard-tier SSM SecureString containing Google service-account email and key.
  PineconeApiKeyParameterName:
    Type: String
    Default: /bluecoins-rag-updater/pinecone-api-key
    Description: Standard-tier SSM SecureString containing the Pinecone API key.
  GoogleDriveFileId:
    Type: String
    Description: Google Drive file ID for the Bluecoins .fydb database.
  PineconeIndexName:
    Type: String
    Description: Existing Pinecone index with 1024 dimensions and cosine metric.
  ApiStageName:
    Type: String
    Default: prod

Resources:
  ServerlessApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref ApiStageName
      EndpointConfiguration: REGIONAL

  IngestionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 5400
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDeadLetterQueue.Arn
        maxReceiveCount: 3

  JobTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda_src/
      Handler: lambda_function.api_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 30
      MemorySize: 1024
      Environment:
        Variables:
          JOB_TABLE_NAME: !Ref JobTable
          INGESTION_QUEUE_URL: !Ref IngestionQueue
          PINECONE_API_KEY_PARAMETER_NAME: !Ref PineconeApiKeyParameterName
          PINECONE_INDEX_NAME: !Ref PineconeIndexName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IngestionQueue.QueueName
        - Statement:
            - Sid: ReadApplicationCredentials
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PineconeApiKeyParameterName}
            - Sid: DecryptPineconeCredential
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
                ArnEquals:
                  kms:EncryptionContext:PARAMETER_ARN: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PineconeApiKeyParameterName}
            - Sid: InvokeBedrockEmbeddingModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
      Events:
        StartIngestion:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessApi
            Path: /ingest
            Method: POST
            Auth:
              Authorizer: AWS_IAM
        GetIngestionStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessApi
            Path: /ingest/{jobId}
            Method: GET
            Auth:
              Authorizer: AWS_IAM
        SearchTransactions:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessApi
            Path: /search
            Method: GET
            Auth:
              Authorizer: AWS_IAM

  IngestionWorker:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda_src/
      Handler: lambda_function.ingestion_worker
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 900
      MemorySize: 4096
      EphemeralStorage:
        Size: 10240
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          JOB_TABLE_NAME: !Ref JobTable
          GOOGLE_DRIVE_FILE_ID: !Ref GoogleDriveFileId
          GOOGLE_CREDENTIALS_PARAMETER_NAME: !Ref GoogleCredentialsParameterName
          PINECONE_API_KEY_PARAMETER_NAME: !Ref PineconeApiKeyParameterName
          PINECONE_INDEX_NAME: !Ref PineconeIndexName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable
        - SQSPollerPolicy:
            QueueName: !GetAtt IngestionQueue.QueueName
        - Statement:
            - Sid: ReadApplicationCredentials
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleCredentialsParameterName}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PineconeApiKeyParameterName}
            - Sid: DecryptApplicationCredentials
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
                ArnEquals:
                  kms:EncryptionContext:PARAMETER_ARN:
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleCredentialsParameterName}
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PineconeApiKeyParameterName}
            - Sid: InvokeBedrockEmbeddingModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
      Events:
        ProcessIngestion:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestionQueue.Arn
            BatchSize: 1

Outputs:
  ApiBaseUrl:
    Description: IAM-authorized API Gateway base URL.
    Value: !Sub https://${ServerlessApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/
  IngestionDeadLetterQueueUrl:
    Description: Inspect this queue for messages that exhausted automatic retries.
    Value: !Ref IngestionDeadLetterQueue
